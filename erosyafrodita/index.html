
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>AGE Parfums - Lujo y Belleza</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Sans:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Google Analytics y Meta Pixel se cargan solo tras aceptar cookies,
         ver src/lib/analyticsLoader.ts (respeto de consentimiento RGPD) -->

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/AGE-SVG.jpeg"/>
    
    <!-- Tailwind CSS: compilado en build time (ver tailwind.config.js),
         ya no se sirve desde el CDN de desarrollo (cdn.tailwindcss.com no
         está pensado para producción: bloquea el hilo, recalcula clases en
         el navegador de cada visitante y no hace purga de CSS no usado). -->
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px;
            border-radius: 50%; background: #0C3528; cursor: pointer; margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #EFECE5; border-radius: 2px;
        }

        body {
            background-color: #F9F8F3;
        }
    </style>
