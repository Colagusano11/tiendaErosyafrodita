# Robots de vista previa de redes sociales: no ejecutan JavaScript, así que
# nunca ven las etiquetas og:image que React pone en tiempo de ejecución para
# cada producto — sin esto, compartir cualquier ficha siempre mostraba la
# imagen genérica de la tienda. Se detectan por su User-Agent y se les sirve
# una vista mínima con la imagen real del producto (ver SocialPreviewController).
map $http_user_agent $is_social_bot {
    default 0;
    ~*facebookexternalhit 1;
    ~*Facebot 1;
    ~*WhatsApp 1;
    ~*Twitterbot 1;
    ~*LinkedInBot 1;
    ~*TelegramBot 1;
    ~*Slackbot 1;
    ~*Discordbot 1;
    ~*Pinterest 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Ficha de producto: robots de redes sociales -> vista previa con la
    # imagen real (backend), usuarios reales -> la SPA de siempre.
    location ~ ^/product/(?<slug>[^/]+)/?$ {
        if ($is_social_bot) {
            proxy_pass http://app:8080/social-preview/product/$slug;
            break;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: todas las rutas al index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets estáticos con caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # sitemap.xml y robots.txt: la ruta canónica que rastrean los buscadores es
    # SIN /api (así lo exige la convención), pero solo existen de verdad en el
    # backend (SitemapController) — sin esto, /sitemap.xml caía en el catch-all
    # de la SPA y devolvía el index.html (content-type text/html), así que
    # Google nunca pudo leer el sitemap real por la URL estándar.
    location = /sitemap.xml {
        proxy_pass http://app:8080/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://app:8080/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy imágenes del backend (usando nombre de servicio Docker, NO IP)
    location /api/proxy-image {
        proxy_pass http://app:8080/proxy-image;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API interna de SellerKing (SellerKingInternalController / SellerKingProductController):
    # a diferencia del resto de controladores, estos SÍ tienen "/api/internal" grabado en su
    # @RequestMapping, así que aquí NO se recorta el prefijo /api — si no, todas las llamadas
    # (sync de pedidos, publicación de productos) llegan a una ruta que no existe y dan 403.
    location /api/internal/ {
        proxy_pass http://app:8080/api/internal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Proxy API principal (usando nombre de servicio Docker, NO IP)
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
