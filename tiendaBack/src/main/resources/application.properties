spring.application.name=tiendaonline
server.port=8080


# ========================
# CONFIGURACION MySQL
# ========================

spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/tienda_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ========================
# JPA / Hibernate
# IMPORTANTE: 'validate' en produccion — Flyway gestiona el schema.
# Usar 'create-drop' solo en tests locales con H2.
# NUNCA usar 'update' en produccion (modifica schema en vivo sin control).
# ========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# FLYWAY — Migraciones controladas
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.repair-on-migrate=true

# User MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#RUTAS
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

spring.cloud.discovery.client.simple.instances.mcsv-usuario[0].uri=http://mcsv-usuario:8080
spring.cloud.loadbalancer.enabled=true


config.baseurl.endpoint.mcsv-usuario=http://mcsv-usuario:8080

# ========================
# PASARELAS DE PAGO
# =======================

revolut.api.key=${REVOLUT_API_KEY}
revolut.api.url=https://merchant.revolut.com/api/1.0
app.frontend.url=${FRONTEND_URL:https://erosyafrodita.com}
app.base.url=${FRONTEND_URL:https://erosyafrodita.com}

# PayPal
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE:sandbox}

# ========================
# JWT (misma clave que mcsv-usuario para validar tokens)
# ========================
application.security.jwt.secret-key=${JWT_SECRET}

# ========================
# ACTUATOR & MONITORING
# ========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# ========================
# AMAZON SP-API
# ========================
amazon.spapi.clientId=${AMAZON_CLIENT_ID:}
amazon.spapi.clientSecret=${AMAZON_CLIENT_SECRET:}
amazon.spapi.refreshToken=${AMAZON_REFRESH_TOKEN:}
amazon.spapi.marketplaceId=${AMAZON_MARKETPLACE_ID:A1RKKUPIHCS9HS}

# ========================
# GEMINI IA
# ========================
gemini.api.key=${GEMINI_API_KEY:}

# ========================
# INSTAGRAM
# ========================
instagram.access.token=${INSTAGRAM_ACCESS_TOKEN:}
instagram.account.id=${INSTAGRAM_ACCOUNT_ID:}
instagram.app.id=${INSTAGRAM_APP_ID:}
instagram.app.secret=${INSTAGRAM_APP_SECRET:}

# ========================
# INTEGRACION SELLERKING (API interna)
# Clave compartida con SellerKing para los endpoints /api/internal/**.
# Debe coincidir con EROSYAFRODITA_INTERNAL_API_KEY en SellerKing.
# Inyectar mediante variable de entorno en producción. Nunca hardcodear.
# ========================
sellerking.internal.api.key=${SELLERKING_INTERNAL_API_KEY:REEMPLAZAR_CON_API_KEY_REAL}
