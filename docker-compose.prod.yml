# ============================================================
# docker-compose.prod.yml — PRODUCCIÓN con Traefik + HTTPS
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requisitos:
#   1. Dominio apuntando a la IP del servidor (A record)
#   2. Puertos 80 y 443 abiertos en el firewall
#   3. Fichero .env con ACME_EMAIL y DOMAIN configurados
#   4. mkdir -p ./traefik/letsencrypt && touch ./traefik/letsencrypt/acme.json && chmod 600 ./traefik/letsencrypt/acme.json
# ============================================================

services:

  # ── Traefik: Reverse Proxy + SSL automático ────────────────
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      # API dashboard (solo para debug, deshabilitar en prod estable)
      - "--api.dashboard=false"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=app-net"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redireccion HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Let's Encrypt (ACME)
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Logs
      - "--log.level=WARN"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/letsencrypt:/letsencrypt"
    networks:
      - app-net
    labels:
      - "traefik.enable=false"

  # ── Frontend: expuesto via Traefik (sin puerto directo) ────
  frontend:
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Redireccion www → sin www
      - "traefik.http.middlewares.redirect-www.redirectregex.regex=^https://www\\.${DOMAIN}(.*)"
      - "traefik.http.middlewares.redirect-www.redirectregex.replacement=https://${DOMAIN}$${1}"
      - "traefik.http.middlewares.redirect-www.redirectregex.permanent=true"
      - "traefik.http.routers.frontend.middlewares=redirect-www"

  # ── Backend: expuesto SOLO internamente (sin acceso directo) ─
  app:
    ports: !reset []
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FRONTEND_URL: https://${DOMAIN:-erosyafrodita.com}
      APP_FRONTEND_URL: https://${DOMAIN:-erosyafrodita.com}
      REVOLUT_WEBHOOK_URL: https://${DOMAIN:-erosyafrodita.com}/api/pagos/revolut/webhook
    labels:
      - "traefik.enable=false"

  # ── Microservicio usuarios: solo interno ───────────────────
  mcsv-usuario:
    ports: !reset []
    labels:
      - "traefik.enable=false"

  # ── Bases de datos: solo internas ─────────────────────────
  db:
    ports: !reset []

  db-usuarios:
    ports: !reset []

networks:
  app-net:
    external: false
